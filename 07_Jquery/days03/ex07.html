<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name ="viewport" content ="width=device-width, initial-scale=1.0">
<title>2026. 7. 27. 오후 4:33:43</title>
<link rel="shortcut icon" type="image/x-icon" href="/images/SiSt.ico">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<link rel="stylesheet" href="/resources/cdn-main/example.css">
<script src="/resources/cdn-main/example.js"></script>
<style>
	#container{
		display:flex;
		width:60%;
		margin: 0 auto;
	}
	#container > div{
		width: 33%;
	}
	#container > div > select{
		width: 100%;
		height: 200px;
	}
	#container > div > button{
		width: 100%;
	}
</style>
</head>
<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">My Home</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>
  </ul>
</header>
<div>
	<xmp class="code">

	</xmp>
	<div id="container">
		<div>
			<select id="leftCmb" multiple="multiple">
				<option>안준호</option>
				<option selected="selected">박지웅</option>
				<option value="">서주원</option>
				<option selected="selected">김민선</option>
				<option selected="selected">김현수</option>
			</select>
		</div>
		<div>
			<button>▶</button><br>
			<button>▶▶</button><br>
			<button>◀</button><br>
			<button>◀◀</button><br>
		</div>
		<div>
			<select id="rightCmb" multiple="multiple">
			</select>
		</div>
	</div>
</div>
<script>
  // jq
  $("button").first().on("click",function(){
	  $("#leftCmb > option:selected").each(function(index,element){
		  // jq method: clone().
		  // 부모요소.append(자식요소)
		  // 자식요소.appendTo(부모요소)
		  // 복제한 옵션      .appendTo( 오른쪽 select 부모요소)
		  $(element).clone().appendTo($("#rightCmb"));
	  });
  });
  $("button").eq(1).on("click",function(){
	  $("#leftCmb > option:selected").each(function(index,element){
		  $(element).appendTo($("#rightCmb"));
	  });
  });
</script>
</body>
</html>
