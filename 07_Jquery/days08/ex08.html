<script>
	const questions = ["잘 생긴사람?","착한 사람?","좋아하는 동물?"];
	
	let currentQuestion = 0;
	
	$("#question").html(`문제 ${currentQuestion+1} : ${questions[currentQuestion]}`);

		displayQuestion(-1)
		/*

		/*

	function displayQuestion(value){
		currentQuestion += value;
		if(currentQuestion == questions.length || currentQuestion == -1){
			currentQuestion -= value;
			alert("더 이상 문제가 없습니다.");
			return ;
		}
		$("#question").html(`문제 ${currentQuestion+1} : ${questions[currentQuestion]}`);
	}
