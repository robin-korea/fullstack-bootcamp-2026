<div>
	<xmp class="code">
		이벤트 등록: on()
		           one()
		이벤트 취소: off()
	</xmp>
	
	<button id="one">One</button>
	<button id="bind">Add Click</button>
	<button id="unbind">Remove Click</button>
	
	<div id="box" style="display: none">Click!!!</div>
</div>
<script>
	function flash(){
		$("#box")
			.css("color","blue")
			.show()
			.fadeOut(4000);	
	}

	// #one 버튼에 클릭이벤트를 등록
	$("#bind").on("click",function(){
		// $("body #one").on("click", flash);
		// $("body").find("#one").on("click",flash);
		$("body")
			.on("click", "#one", flash)
			.find("#one")
			   .text("Can Click!!!");
		
	});
	
	// 등록된 이벤트를 언바인딩(취소)
	$("#unbind").on("click",function(){
		$("body").off("click","#one",flash)
			 .find("#one")
			   .text("One");
	});
</script>
