<header>

  <ul>
    <li><a href="#">로그인</a></li>

<div id="content">
	<xmp class="code">

	</xmp>
	<button class="btn1">change color</button>
	
	<div>Div 1</div>
	<div>Div 2</div>
	<div>Div 3</div>
	
	<input type="text"><br>

	<input type="text"><br>
	<input type="text"><br>
	<input type="text"><br>

<script>
	$(":text").addClass("full");
	$(":text:eq(2)").focus();
	
	$("#content div:first-of-type").css("background-color","red");
	$("#content div:eq(1)").css("background-color","green");
	$("#content div:last-of-type").css("background-color","blue");

	function div_animate(){
		$("#content div:eq(0)")
			.animate({width:"50%"},"slow")
			.animate({width:"100%"},"slow", div_animate);
	}
	
	div_animate();
	
	$(":focus").css("background-color","yellow");
	
	$("button.btn1").on("click",function(){
		$("#content div:animated").css("background-color","yellow");
	});
	
</script>
