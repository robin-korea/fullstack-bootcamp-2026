<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026. 8. 3. 오전 11:45:06</title>
<link rel="shortcut icon" type="image/x-icon" href="/images/SiSt.ico">
<script
	src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<link rel="stylesheet" href="/resources/cdn-main/example.css">
<script src="/resources/cdn-main/example.js"></script>
<script src="cookie.js"></script>
<style>
</style>
</head>
<body>
	<header>
		<h1 class="main">
			<a href="#" style="position: absolute; top: 30px;">My Home</a>
		</h1>
		<ul>
			<li><a href="#">로그인</a></li>
			<li><a href="#">회원가입</a></li>
		</ul>
	</header>
	<div>
		<xmp class="code"> </xmp>
		<table border="1"
			style="background-color: white; width: 400px; margin: 0 auto">
			<tr>
				<td><img src="../images/item01.gif" alt="" /></td>
				<td><img src="../images/item02.gif" alt="" /></td>
				<td><img src="../images/item03.gif" alt="" /></td>
			</tr>
			<tr>
				<td><input type="radio" checked="checked" name="bgImages"
					id="item01" value="item01" />item01</td>
				<td><input type="radio" name="bgImages" id="item02"
					value="item02" />item02</td>
				<td><input type="radio" name="bgImages" id="item03"
					value="item03" />item03</td>
			</tr>
		</table>
	</div>
<script>
	$(function(){
		let cname = "bgimage";
		let cvalue = getCookie(cname);
		if(!cvalue) cvalue = "item01";
		
		// 쿠키에 저장된 배경이미지가 있을 경우
		// 1) body의 배경이미지로 설정
		$("body").css("background-image", `url(../images/${cvalue}.gif)`);
		// 2) 그 해당 라디오 버튼을 체크해 두자.
		$(`#${cvalue}`).prop("checked",true);
		
		$(":radio[name=bgImages]").on("click",function(){
			cvalue=$(this).val();
			setCookie(cname,cvalue,10);
			
			$("body").css("background-image", `url(../images/${cvalue}.gif)`);
		});
		
	});
</script>
</body>
</html>
