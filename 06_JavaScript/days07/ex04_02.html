<script>
  // 클로저 -> ES2022 private 클래스 필드 추가
  class Counter{
	  // # private int count = 0;
	  #count = 0;  // public int count = 0 필드
	  
	  increment(){ // 메서드
		  this.#count++;
		  return this.#count;
	  }
  }
  
  const myCounter = new Counter();
  
  $("button").on("click", function (){
	  $("#demo").html( myCounter.increment() );
	  
	  // X private 멤버이기 에 객체.X $("#demo").html( ++myCounter.count );
  });
  
</script>
