    [js 중첩함수 설명]
    중첩함수 ?  외부함수 안에 선언된 내부함수    
    왜? 함수 안에 함수를 선언하는가? 
  </xmp>
  
  <button>count!!</button>  
  <p id="demo"></p> 
  
</div>
<script>

  $("button").on("click", function (){
	  $("#demo").html(  plus()  );
  });
  
  //  자체호출 함수
  let plus = (function (){         // 익명 외부함수
				  let counter = 0;  // 지역 변수	
				  // 내부함수를 리턴
				  return function plus(){
							  // 외부함수의 선언된 지역변수를 내부함수에서 사용할 수 있다.
							  counter++;
							  return counter;
						};
			  })();
  /*
     변수에는 내부함수 plus() 저장된다. 
  let plus = function plus(){
				  // 외부함수의 선언된 지역변수를 내부함수에서 사용할 수 있다.
				  counter++;
				  return counter;
			};
  */
