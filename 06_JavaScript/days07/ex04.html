<script>

  // 함수 클로저
  function draggable( elemt ){  // 외부함수
	
	// 마우스 다운할 때 클릭한 위치를 저장   
	let elemtX = 0, elemtY = 0; // 지역변수(== 전역변수처럼 사용)
	let moveX = 0, moveY = 0; // 지역변수(== 전역변수처럼 사용)
	 
	// myDiv1 >  부모ID+Header   
	if ( document.querySelector(`#${elemt.id}Header`) ) {
		document.querySelector(`#${elemt.id}Header`).onmousedown = dragMouseDown; 
	} // if
	
	function dragMouseDown(e){  // 내부함수
	  e = window.event || e;
	  console.log(`[md] ${ e.clientX } / ${ e.clientY }`);
	  
	  elemtX = e.clientX;
	  elemtY = e.clientY;
	  
	  // myDiv1Header 아이디를 가진 div 태그에 마우스무브, 마우스업 이벤트 등록
	  document.onmousemove = dragMouseMove;	
	  document.onmouseup = dragMouseUp;	
	} // dragMouseDown
	
	function dragMouseMove(e){  // 내부함수
		e = window.event || e;
		console.log(`[mm] ${ e.clientX } / ${ e.clientY }`);
		
		 moveX = elemtX - e.clientX;
         moveY = elemtY - e.clientY;
         elemt.style.left = (elemt.offsetLeft - moveX )+"px";
         elemt.style.top = (elemt.offsetTop - moveY )+"px";
		
         // 움직인 좌표가 다시 마우스 다운한 위치로 셋팅 .. 
         elemtX = e.clientX;
         elemtY = e.clientY;
	}
	
	function dragMouseUp(e){  // 내부함수
		// myDiv1Header 아이디를 가진 div 태그에 마우스무브, 마우스업 이벤트 제거
		document.onmousemove = null;	
		document.onmouseup = null;
	} 
	  
  } // draggable

  
  // $( ".draggable" ).draggable();
  draggable( document.querySelector("#myDiv1") );
  draggable( document.querySelector("#myDiv2") );
</script>
