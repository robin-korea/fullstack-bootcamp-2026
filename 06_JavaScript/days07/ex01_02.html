<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026. 7. 31. 오전 9:27:31</title>
<link rel="shortcut icon" type="image/x-icon" href="/images/SiSt.ico">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<link rel="stylesheet" href="/resources/cdn-main/example.css">
<script src="/resources/cdn-main/example.js"></script>
<style>
  *{
      box-sizing: border-box;
   }
    .alert{
      padding: 20px;
      background-color: #f44336;
      color:white;
      opacity: 1; 
           transition:opacity 0.6s, height 0.6s;
      margin-bottom: 15px;
   }
   
    .closebtn{
     margin-left: 15px;
     color:white;
     font-weight: bold;
     float:right;
     font-size: 22px;
     line-height: 20px;
     cursor:pointer;
     transition:0.3s;
   }
   .closebtn:hover{
      color:black;
   }
   
   .alert.success{     background-color: #4caf50;   }
   .alert.info{      background-color: #2196f3;   }
   .alert.warning{     background-color: #ff9800;   }
   
</style>
</head>
<body>
<header>
  <h1 class="main"><a href="#" style="position: absolute;top:30px;">kEnik HOme</a></h1>
  <ul>
    <li><a href="#">로그인</a></li>
    <li><a href="#">회원가입</a></li>
  </ul>
</header>
<div>
  <xmp class="code">  
     [문제] 모든 공지사항을 삭제 후 새로운 공지사항을 추가하면 추가되지 않는다.
  </xmp>

<h2>알림(공지사항)</h2>
공지사항 타입 : 
<select name="type" id="type">
   <option>type 없음</option>
   <option>success</option>
   <option>warning</option>
   <option>info</option>
</select>
<br>
내용  : <input type="text" id="message" class="long" />

<button>공지사항 추가</button>
<br>	
<hr> 

<!-- 
<div class="alert">
  <span class="closebtn">&times;</span>
  <strong>Danger!</strong>
  Lorem ipsum dolor sit amet, consectetur adipisicing.
</div>
<div class="alert success">
  <span class="closebtn">&times;</span>
  <strong>Success!</strong>
  Lorem ipsum dolor sit amet, consectetur adipisicing.
</div>  
<div class="alert warning">
  <span class="closebtn">&times;</span>
  <strong>Warning!</strong>
  Lorem ipsum dolor sit amet, consectetur adipisicing.
</div>   
<div class="alert info">
  <span class="closebtn">&times;</span>
  <strong>Info!</strong>
  Lorem ipsum dolor sit amet, consectetur adipisicing.
</div>   
   -->
</div>
<script>
  // 공지사항 DB 조회 + 화면 출력 X  => 공지사항 4개를 가지고 있는 배열 선언
  let notices = [
	  {type:"success",  message:"Lorem ipsum dolor sit amet, consectetur adipisicing."},
      {type:"warning",  message:"Lorem ipsum dolor sit amet, consectetur adipisicing."},
      {type:"info",     message:"Lorem ipsum dolor sit amet, consectetur adipisicing."},
      {type:"success",  message:"Lorem ipsum dolor sit amet, consectetur adipisicing."} 
  ];
/*  
<div class="alert info">
  <span class="closebtn">&times;</span>
  <strong>Info!</strong>
  Lorem ipsum dolor sit amet, consectetur adipisicing.
</div> 
*/
 
  for (let notice of notices) {
	// console.log( notice.type + " / " + notice.message);
	const noticeElement =  $(`<div class="alert ${notice.type}">
							    <span class="closebtn">&times;</span>
							    <strong>${notice.type}!</strong>
							    ${notice.message}
							  </div>`);
	$("body > div").append( noticeElement );
  } // for of

  // 추가 버튼을 클릭할 때 새로운 입력받은 공지사항을 추가.
  $("button").on("click", function (){
	  // type 없음
	  let type = $("#type").val();
	  if( type == "type 없음" ){
		  alert("공지사항의 타입을 선택하세요!!!")
		  return;
	  } // if
	  
	  let message = $("#message").val();
	  
	  const noticeElement =  $(`<div class="alert ${type}">
			    <span class="closebtn">&times;</span>
			    <strong>${type}!</strong>
			    ${message}
			  </div>`);
	  noticeElement.find("span.closebtn").on("click", function (){
		  // $(this).parent().hide();
		  const noticeDiv = $(this).parent();
		  noticeDiv.css("opacity", "0");
		  setTimeout(() => {  noticeDiv.remove() }, 600);
	  });
	  
      // $("body > div").append( noticeElement );
	  // 챗GPT: $("#container > div:first").before($newDiv);
	  // $("div.alert:first").before(  noticeElement );
	  // $("div.alert").first().before(  noticeElement );
	  $("body > div > hr").after(noticeElement);
	  
  }); // click
  
  // 닫기 버튼 X : 해당 공지사항 삭제
  $(".alert span.closebtn").on("click", function (){
	  // $(this).parent().hide();
	  const noticeDiv = $(this).parent();
	  noticeDiv.css("opacity", "0");
	  setTimeout(() => {  noticeDiv.remove() }, 600);
  });
  
</script>
</body>
</html>
