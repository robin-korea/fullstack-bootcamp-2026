<script>
	class Car{

		// 생성자 Car(){}
		// js 생성자 오버로딩 X
		constructor(name, year){
			// 필드 초기화
			this.name = name;
			this.year = year;
		}
		
		// js 메서드 선언
		// 메서드 선언 - 생성자는 오버로딩이 불가능하지만 메서드는 오버로딩 지원 불가.
		method1(){}
		method2(){}
		// age() 메서드 선언: 올해년도 - 년식(year)
		age(){
			// js는 변수를 선언하지 않아도 사용할 수 있지만
			// 클래스 안에서는 엄격모드 이기에 반드시 선언하고 사용해야 된다
			const now = new Date();
			return now.getFullYear - this.year;
		}
		// 생성자는 오버로딩 X, 메서드는 오버로딩 O
		age(d){
			const now = new Date();
			return d - this.year;
		}
	}
