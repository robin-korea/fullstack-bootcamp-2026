<div>
	<xmp class="code">
		1. apply() : 다른 객체의 메서드를 불러서 처리할 수 있는 함수
		2. call() : 다른 객체의 메서드를 불러서 처리할 수 있는 함수
			차이점: apply() 매개변수로 배열 사용
			       call() 매개변수로  매개변수,,, 나열
	</xmp>
</div>
<script>
	// js 객체 생성 person1 ~ person 100
	// 다른 객체 생성 + print() 구현
	let otherPerson = {
		print: function(){
			return this.name + "/" + this.age;
		},
		printf: function(city,gender){
			return this.name + "/" + this.age + "/" + city + "/" + gender;
		} 
	}
	


	let person1 = {
			name:"hong",
			age:20,
			/* print: function(){
				return this.name + "/" + this.age;
			} */
	};
	let person2 = {
			name:"park",
			age:32,
			/* print: function(){
				return this.name + "/" + this.age;
			} */
	};
	let person100 = {
			name:"back",
			age:26,
			/* print: function(){
				return this.name + "/" + this.age;
			} */
	};
	document.write( otherPerson.printf.apply(person1, ["seoul",true]) + "<br>");
	document.write( otherPerson.printf.call(person1, "seoul",true) + "<br>");
	
	document.write("<hr>");
	document.write( otherPerson.print.apply(person1, null) + "<br>");
	document.write( otherPerson.print.apply(person2, null) + "<br>");
	document.write( otherPerson.print.apply(person100, null) + "<br>");
	document.write("<hr>");
	document.write( otherPerson.print.call(person1, null) + "<br>");
	document.write( otherPerson.print.call(person2, null) + "<br>");
	document.write( otherPerson.print.call(person100, null) + "<br>");
</script>
