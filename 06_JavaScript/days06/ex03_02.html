	<xmp class="code">
		js 클래스 상속 가능: extends 키워드를 사용
		클래스 선언은 호이스팅 되지 않기 때문에 사용하기 전에
		항상 먼저 클래스 선언을 해야 된다
	</xmp>
</div>
<script>
	class Car{
		constructor(brand){
			this.carname = brand;
		}
		present(){
			return this.carname + "!!!";
		}
		// getter, setter
		get cname(){
			return this.carname;
		}
		set cname(x){
			this.carname = x;
		}
		
		static hello(){
			return "hello!";
		}
	}
	
	class Model extends Car{
		constructor(brand,mod){
			super(brand);
			this.model = mod;
		}
		
		show(){
			return this.present() + "/" + this.model;
		}
	}
	
	const myCar = new Model("Kia","K9");
	alert(myCar.show());
</script>
