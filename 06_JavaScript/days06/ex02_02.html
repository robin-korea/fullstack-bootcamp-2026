<script>
// 중첩 객체, 배열
	const person = {
			firstname: "길동",
			lastname: "홍",
			age: 20, 
			cars : [
				{name:"K9", year: 2020},
				{name:"K5", year: 2021},
				{name:"K2", year: 2023}
			],
			
			// 메서드
			print: function(){
				return this.firstname + "/" + this.lastname;
			},
			
			// getter
			get fullname(){
				return this.firstname + " " + this.lastname;
			},
			
			// getter, setter
			language : "kr",
			get lang(){
				return this.language;
			},
			set lang(language){
				this.language = language;
			}
		
	};
	
	// add 속성 추가
	// Object.definedProperty(person, "add", {});
	
	// set lang("en")
	person.lang = "en"; // setter
	console.log(person.lang); // getter
	
	// Person 객체 생성자에 새로운 속성 추가 : prototype 속성 사용
	// 기존 객체에 새로운 속성 추가
	person.gender = true;
	
	/* 기존 객체에 새로운 메서드 추가
	person.fullname = function(){
		return this.firstname + " " + this.lastname;
	}
	*/ 
	 
	// 기존 객체에 속성 삭제
	// delete person.age;
	
	// 속성을 얻어오는 방법
	console.log(person.gender);
	console.log(person["gender"]);
	// person.cars[0].name
	// person.cars[0]["name"]
	
	person.fullname();
	
	// js 객체 -> 배열 반환: Object.values()
	const personArr = Object.values(person);
	console.log(person);
	console.log(personArr);
</script>
