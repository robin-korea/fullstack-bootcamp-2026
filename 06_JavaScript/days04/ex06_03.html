<script>
	const m = [1,2,3];
	// 배열의 마지막 요소로 추가
	m.push(4);
	m.push(5);
	m.push(6);
	document.write(m.toString() + "<br>");
	
	// pop(): 배열의 마지막 요소를 제거하고 반환하는 메서드
	let last = m.pop();
	document.write(last + "<br>");
	document.write(m.toString() + "<br>");
	
	// unshift(): 첫 번째 요소를 추가하고 모든 요소를 1칸씩 뒤로 이동시키는 메서드
	m.unshift(6);
	document.write(m.toString() + "<br>");
	
	// shift(): 첫 번째 요소를 제거하고 모든 요소를 1칸씩 앞으로 이동시키는 메서드
	m.shift();
	document.write(m.toString() + "<br>");
</script>
