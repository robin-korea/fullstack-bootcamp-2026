<div>
	<xmp class="code">
		[js 숫자 -> 문자열 반환 함수]
		toString()
		toExponential()  "지수표기법" 문자열 반환
		toFixed()            X   + 소수점 이하 자리수 지정
		toPrecision()        X   + 전체자리수
	</xmp>
</div>
<script>
	let x = 9.656;
	document.write(x.toExponential()+"<br>");  // 9.656e+0
	document.write(x.toExponential(2)+"<br>"); // "9.66e+0"
	document.write(x.toExponential(4)+"<br>"); // "9.6560e+0"
	document.write(x.toExponential(6)+"<br>"); // "9.656000e+0"
	
	document.write(x.toFixed(0)+"<br>");  // 10
	document.write(x.toFixed(2)+"<br>"); // 9.66
	document.write(x.toFixed(4)+"<br>"); // 9.6560
	document.write(x.toFixed(6)+"<br>"); // 9.656000

	document.write(x.toPrecision()+"<br>");  // 9.656
	document.write(x.toPrecision(2)+"<br>"); // 9.7
	document.write(x.toPrecision(4)+"<br>"); // 9.656
	document.write(x.toPrecision(6)+"<br>"); // 9.65600
</script>
</body>
