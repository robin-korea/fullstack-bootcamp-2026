		[js 배열(array) 개념과 관련 메서드]
		1. 정의: 데이터 모음, 객체다
		2. 선언 형식
			const 배열명 = [값, 값, 값 ....]

<script>
	const mArr = [1000,3,5,2,4,1];
	// [출력 3] 화살표 함수 (람다식)
	mArr.forEach(element => {
		document.write(element + '<br>');
	});
	document.write("<hr>");
	
	// [출력 2] 배열명.forEach()
	mArr.forEach(function(element){
		document.write(element + '<br>');
	});
	document.write("<hr>");
	
	// [출력 1] 배열의 각 요소를 출력...
	for (var i = 0; i < mArr.length; i++){
		document.write(mArr[i] + "<br>");
	}
	document.write("<hr>");
	
	document.write(mArr.toString() + "<br>");
	document.write(mArr.length + "<br>");
	
	// js 오름차순 정렬
	//  java : Arrays.sort()
	mArr.sort();
	
	// 기본은 문자 코드값으로 오름차순 정렬
	// 1,1000,2,3,4,5
	document.write(mArr.toString() + "<br>");
	
	mArr.sort(function(a,b){
		return a-b;
	});
	
	document.write(mArr.toString() + "<br>");
	
	mArr.sort((a,b)=> b-a);
	
	document.write(mArr.toString() + "<br>");
	
	// 무작위로 섞기
	mArr.sort((a,b) => Math.random() - 0.5);
	document.write(mArr.toString() + "<br>");
	
	
</script>
