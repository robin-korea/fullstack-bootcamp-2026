<script>
	// copyWithin() : 배열의 요소를 배열의 다른 위치에 복사(덮어쓰기)하는 메서드
	const c = [1,2,3,4,5];
	document.write(c.toString() + "<br>");
	//    (target, start, end)
	c.copyWithin(2,0,2);
	document.write(c.toString() + "<br>");
</script>
