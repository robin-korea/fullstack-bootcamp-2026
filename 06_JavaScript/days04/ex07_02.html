 <script>
  function getRndNumber(min, max){
	  return Math.floor( Math.random() * (max-min+1)) + min;
  }
  
  $("button").on("click", function (){
	  const lotto = new Set();
	  while ( lotto.size < 6 ) {
		  n = getRndNumber(1, 45);
		  lotto.add(n);
	  } // while 
	  // Set -> Array 변환	  
	  const sortLotto = [...lotto].sort( (a,b) => a-b );
	  
	  let content = "<ul><li>";
	  content += sortLotto.join("</li><li>");
	  content += "</li></ul>";
	  
	  $("#demo").html( content );
  });
</script>
