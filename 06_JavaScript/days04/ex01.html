<script>
	/*
	const checkAll = document.getElementById("all");

	const ckbAll = document.getElementById("all");
	const ckbList = document.querySelectorAll("table#tblDept > tbody input[id^=ck]");
	
	ckbAll.onclick = function(){
		//alert(this.checked);
		ckbList.forEach((element,index) => {
			element.checked = this.checked;
		});
	}
	
	ckbList.forEach((element, index) => {
		element.onclick = function (){
			
			let is4checked = true;
			for (let i = 0; i < ckbList.length; i++) {
				if(!ckbList[i].checked){
					is4checked = false;
					break;
				}
			}
			
			ckbAll.checked = is4checked;
		}
	});
	
	const btn = document.querySelector("#tblDept > tfoot > tr > td > button");
	const demo = document.getElementById("demo");
	btn.onclick = function(){
		 let content = "<ul>";
		 
		for (let i = 0; i < ckbList.length; i++) {
			if(ckbList[i].checked){
				// let name = ckbList[i].parentElement.nextElementSibling.innerText;
				let name = ckbList[i].dataset.name;
				content += `<li>${name}</li>`;
			}
		}
		
		content += "</ul>";
		
		demo.innerHTML = content;
	}
	
</script>
