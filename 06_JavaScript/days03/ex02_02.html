<script>
	// js 함수 표현식: 변수에 저장된 함수
	/*
	function multiply(a,b){
		return a*b;
	}
	*/
	
	// 익명 함수
	// 함수 표현식
	const multiply = function (a,b){
						return a*b;
	};
	
	// multiply 변수를 마치 함수처럼 사용할 수 있다.
	multiply(1,2);
	
	// 변수에 저장된 함수는 값처럼 사용할 수 있다.
	
	function run(fn){
		return fn();
	}
	
	run(multiply);
</script>

<script>
	// 호이스팅
	// add 함수 호출
	let z = add(2,3);
	
	// 일반함수: add 함수 선언 부분
	// 해당 영역(scope)의 최상위로 "호이스팅" 된다.
	function add(a,b){
		return a+b;
	}
	
	// 함수 표현식은 호이스팅 되지 않는다.
	let k = minus(2,3);
	
	
	/* const minus = function(a,b){
		return a - b;
	} */
	
	// 화살표 연산자를 사용한 함수도 호이스팅 되지 않는다.
	/* const minus = (a,b) => {
		return a-b;
	} */
	
	const minus = (a,b) => a-b;
	
	// 함수 선언은 호이스팅되지만, 함수 표현식은 호이스팅 되지 않는다.
</script>
<script>
	// 자체 호출 함수(기억) -> 함수 클로저 설명 X
	// 익명함수를 만들고 바로 호출
	(function (a,b){
		alert("익명 함수 호출됨...")
	})();
