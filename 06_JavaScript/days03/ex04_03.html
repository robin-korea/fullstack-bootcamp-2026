<div>
	<xmp class="code">
		js, getter, setter 를 사용해서 객체의 필드(속성)에 접근할 수 있다.
	</xmp>
</div>
<script>
	const person = {
			name: "홍길동",
			age : 20,
			
			set setAge(n){
				this.age = n;
			},
			get getAge(){
				return this.age;
			},
			
			language: "",
			set lang(l){
				this.language = l.toUpperCase();
			}
	};
	
	person.setAge = 30;
	person.getAge;
</script>
<script>
	const obj = {counter: 0};
	// Object.definePeroperty() 메소드를 사용해서 getter, setter 추가할 수 있다.
	Object.defineProperty(obj, "reset",{
		get: function (){this.counter = 0;}
	});
	Object.defineProperty(obj, "add",{
		set: function (value) {this.counter += value;}
	});
	
	obj.reset; // counter 필드(속성)는 0으로 초기화된다.
	obj.add = 5; // counter는 5 더하기 된다.
</script>
