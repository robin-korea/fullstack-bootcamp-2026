<div>
	<xmp class="code">
		throw 예외 강제로 발생시키는 문
	</xmp>
	
	<input type="text" id="msg" class="long">
	<button onclick="btn_exec();">실행</button>
	<p id="demo"></p>
	
</div>
<script>
	function btn_exec(){
		let msg = $("#msg").val();
		$("#demo").empty();
		
		try {
			if(msg.trim() == "") throw "empty";
			if(isNaN(msg)) throw "not a number";
			
			let n = Number(msg);
			if(n < 10) throw "too low";
			if(n > 10) throw "too high";
		} catch (e) {
			$("#demo").html(`Input is ${e}`);
		} finally{
			$("#msg").val("").focus(); // 초기화
		}
	}
</script>
