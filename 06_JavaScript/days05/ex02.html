<script>
	$("button").on("click",function(){
		// js List 개념 X -> Array 사용 O
		const lottos = [];
		let lotto;
		let n;
		let cnt = $("#cmbCnt").val();
		
		for (var i = 1; i <= cnt; i++) {
			lotto = new Set();
			while (lotto.size < 6) {
				n = getRndNumber(1,45);
				lotto.add(n);
			}
			lottos.push(lotto);
		}
		// console.log(lottos);
		// demo 출력: 두 자리 정수 형식으로 출력...
		
		let content = "";
		
		lottos.forEach(function(set, index, array){
			const sortLotto = [...set].sort((a,b)=>a-b);
			content += `${index+1} 게임 : `;
			let strSortLotto = sortLotto.map(function(e,i,arr){
				return e.toString().padStart(2,"0");
			});
			
			// content += sortLotto.join("\t");
			content += strSortLotto.join("\t");
			content += "<br>";
			
		});
		
		$("#demo").empty().html(content);

	});
</script>
